name: MECORRESPONDE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  legal-engine-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run legal and API regression suite
        run: python -m pytest -q tests

  postgres-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mecorresponde_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mecorresponde_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mecorresponde_test -d mecorresponde_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql://mecorresponde_test:test_password@localhost:5432/mecorresponde_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run PostgreSQL persistence smoke test
        run: python -m pytest -q integration_tests/test_postgres_persistence.py

  postgres-backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mecorresponde_backup
          POSTGRES_PASSWORD: backup_test_password
          POSTGRES_DB: mecorresponde_backup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mecorresponde_backup -d mecorresponde_backup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql://mecorresponde_backup:backup_test_password@localhost:5432/mecorresponde_backup_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run real backup and isolated restore rehearsal
        run: python -m pytest -q integration_tests/test_postgres_backup_restore.py
