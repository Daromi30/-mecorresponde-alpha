name: Database Migrations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mecorresponde_test
          POSTGRES_DB: mecorresponde_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mecorresponde_test -d mecorresponde_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql://mecorresponde_test@localhost:5432/mecorresponde_test"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock && python -m pip check
      - name: Verify Alembic adoption and fresh bootstrap
        run: python -m pytest -q integration_tests/test_migrations.py
