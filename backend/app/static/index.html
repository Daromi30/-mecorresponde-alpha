<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MECORRESPONDE Alpha</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7f8;color:#15171a}.wrap{max-width:820px;margin:auto;padding:36px 18px}.brand{font-weight:850;letter-spacing:-.04em;font-size:20px}.tag{display:inline-block;background:#eceff1;border-radius:999px;padding:5px 9px;font-size:12px;margin-left:8px}.card{background:#fff;border:1px solid #e1e4e7;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 2px 12px #00000008}textarea,input,select{width:100%;padding:12px;border:1px solid #cbd1d6;border-radius:9px;font:inherit;margin:8px 0 12px}button{border:0;border-radius:9px;background:#181a1d;color:#fff;padding:12px 16px;font-weight:750;cursor:pointer;margin-right:8px;margin-top:6px}button.alt{background:#e9ecef;color:#17191b}.muted{color:#65707a}.money{font-size:42px;font-weight:850;letter-spacing:-.04em}.ok{color:#146c3b}.warn{color:#965d00}.error{color:#a21c1c;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.fact{padding:8px 0;border-bottom:1px solid #eef0f1}.pre{white-space:pre-wrap;background:#f7f8f9;padding:14px;border-radius:10px}.step{border-left:3px solid #d6dade;padding-left:14px;margin:10px 0}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding-top:24px}}
</style></head>
<body><div class="wrap"><div class="brand">MECORRESPONDE <span class="tag">Internal Alpha E04-B</span></div>
<div class="card" id="start"><h1>Cuéntame qué te ha pasado.</h1><p class="muted">Demo autocontenido del primer vertical slice. No requiere cuenta ni API de IA.</p><textarea id="story" rows="6">Me cambié de compañía de luz y me siguen cobrando un mantenimiento.</textarea><button onclick="createCase()">Analizar mi caso</button></div>
<div id="caseArea" class="hidden">
  <div class="card"><span class="tag" id="status"></span><h2 id="title"></h2><div id="questionArea"></div></div>
  <div class="card" id="diagnosisCard"><h2>Diagnóstico</h2><div id="diagnosis"></div></div>
  <div class="card hidden" id="claimCard"><h2>Reclamación preparada</h2><div id="claim"></div><button onclick="registerSubmission()">Registrar envío demo</button></div>
  <div class="card hidden" id="responseCard"><h2>Respuesta de la empresa</h2><textarea id="responseText" rows="5" placeholder="Pega aquí la respuesta..."></textarea><button onclick="sendResponse()">Analizar respuesta</button><div id="responseResult"></div></div>
  <div class="card hidden" id="outcomeCard"><h2>Resultado</h2><button onclick="closeCase(true)">Confirmar que recibí el dinero</button><button class="alt" onclick="closeCase(false)">Aceptado pero aún no cobrado</button><div id="outcome"></div></div>
  <div class="card"><h3>Expediente estructurado</h3><div id="facts"></div></div>
</div><div id="error" class="error"></div></div>
<script>
let caseId=null, caseData=null;
async function req(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});if(!r.ok)throw new Error(await r.text());return r.json()}
function err(e){document.getElementById('error').textContent=String(e);}
async function createCase(){try{const message=document.getElementById('story').value;const c=await req('/api/cases',{method:'POST',body:JSON.stringify({message})});caseId=c.id;document.getElementById('caseArea').classList.remove('hidden');await refresh();}catch(e){err(e)}}
async function refresh(){caseData=await req(`/api/cases/${caseId}`);document.getElementById('status').textContent=caseData.status;document.getElementById('title').textContent=caseData.title||'Caso';document.getElementById('facts').innerHTML=caseData.facts.map(f=>`<div class="fact"><b>${f.key}</b><br>${JSON.stringify(f.value)} <span class="muted">${f.state}</span></div>`).join('')||'<span class="muted">Todavía no hay hechos.</span>';const q=await req(`/api/cases/${caseId}/next-question`);renderQuestion(q);if(caseData.decisions.length)renderDecision(caseData.decisions[0]);}
function renderQuestion(q){const a=document.getElementById('questionArea');if(q.done){a.innerHTML='<p class="ok">Hechos mínimos completos.</p><button onclick="diagnose()">Generar diagnóstico</button>';return}let input='';if(q.input_type==='boolean')input=`<select id="answer"><option value="">Selecciona</option><option value="true">Sí</option><option value="false">No</option></select>`;else if(q.input_type==='charges')input='<p class="muted">Para el demo añadiremos tres cargos de 8,99 € correspondientes íntegramente a períodos posteriores.</p><button onclick="addCharges()">Añadir cargos demo</button>';else input=`<input id="answer" type="${q.input_type==='date'?'date':'text'}">`;a.innerHTML=`<h3>${q.question}</h3>${input}${q.input_type==='charges'?'':`<button onclick="answer('${q.field}','${q.input_type}')">Continuar</button>`}`;}
async function answer(key,type){try{let v=document.getElementById('answer').value;if(type==='boolean')v=v==='true';await req(`/api/cases/${caseId}/facts`,{method:'POST',body:JSON.stringify({key,value:v,state:'confirmed',user_confirmed:true})});await refresh()}catch(e){err(e)}}
async function addCharges(){try{await req(`/api/cases/${caseId}/charges`,{method:'POST',body:JSON.stringify({charges:[{amount:8.99,service_period_start:'2026-06-04',service_period_end:'2026-07-03',evidence_verified:true},{amount:8.99,service_period_start:'2026-07-04',service_period_end:'2026-08-03',evidence_verified:true},{amount:8.99,service_period_start:'2026-08-04',service_period_end:'2026-09-03',evidence_verified:true}]})});await refresh()}catch(e){err(e)}}
async function diagnose(){try{const d=await req(`/api/cases/${caseId}/diagnose`,{method:'POST'});renderFullDiagnosis(d);await refresh();if(['HIGH','MEDIUM'].includes(d.viability)&&d.claimable_amount>0){const c=await req(`/api/cases/${caseId}/prepare-claim`,{method:'POST'});renderClaim(c)}}catch(e){err(e)}}
function renderDecision(d){document.getElementById('diagnosisCard').classList.remove('hidden');document.getElementById('diagnosis').innerHTML=`<div class="money">${d.claimable_amount==null?'—':Number(d.claimable_amount).toFixed(2)+' €'}</div><b>Viabilidad: ${d.viability}</b><p>${d.reasoning_summary}</p><p><b>¿Me compensa?</b> ${d.worth_pursuing}</p>`}
function renderFullDiagnosis(d){renderDecision(d);if(d.counterarguments?.length)document.getElementById('diagnosis').innerHTML+=`<h3>Contradictor</h3><ul>${d.counterarguments.map(x=>`<li>${x.type}: ${x.status}</li>`).join('')}</ul>`}
function renderClaim(c){document.getElementById('claimCard').classList.remove('hidden');document.getElementById('claim').innerHTML=`<div class="money">${Number(c.amount).toFixed(2)} €</div><div class="pre">${c.text}</div>`}
async function registerSubmission(){try{const s=await req(`/api/cases/${caseId}/submission`,{method:'POST',body:JSON.stringify({submitted_on:new Date().toISOString().slice(0,10),channel:'demo',reference_number:'DEMO-001'})});document.getElementById('responseCard').classList.remove('hidden');document.getElementById('claim').innerHTML+=`<p class="warn"><b>Plazo calculado:</b> ${s.deadline} · ${s.deadline_status}</p>`;await refresh()}catch(e){err(e)}}
async function sendResponse(){try{const text=document.getElementById('responseText').value;const r=await req(`/api/cases/${caseId}/responses`,{method:'POST',body:JSON.stringify({text})});document.getElementById('responseResult').innerHTML=`<div class="pre">${JSON.stringify(r,null,2)}</div>`;if(r.analysis.type==='ACCEPTANCE')document.getElementById('outcomeCard').classList.remove('hidden');await refresh()}catch(e){err(e)}}
async function closeCase(verified){try{const r=await req(`/api/cases/${caseId}/outcome`,{method:'POST',body:JSON.stringify({result_type:'FAVORABLE',amount_recovered:26.97,verified_by_user:verified})});document.getElementById('outcome').textContent=`Estado: ${r.case_status}`;await refresh()}catch(e){err(e)}}
</script></body></html>
